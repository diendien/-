<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>啟動捷徑中...</title>
  <script>
    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      const name = params.get('name') || '通知抵達';
      const input = params.get('input') || '';
      const store = params.get('store') || '';
      const row = params.get('row') || '';
      const date = params.get('date') || '';
      
      const shortcutUrl = 'shortcuts://run-shortcut?name=' + encodeURIComponent(name) + '&input=' + encodeURIComponent(input);

      // 1. 背景向 GAS 發送抵達寫入請求（確保第 14 欄同步寫入）
      if (store && row) {
        const gasUrl = 'https://script.google.com/macros/s/AKfycbwHR7oJjw8yej7Dc44VaDsvrrSNc1aRpZIDkrOJ6WwaC17qZdDWaRcTUVNJGljdKFMp/exec';
        fetch(gasUrl + '?action=arrive_shortcut&store=' + encodeURIComponent(store) + '&date=' + encodeURIComponent(date) + '&row=' + encodeURIComponent(row), { mode: 'no-cors' }).catch(function(){});
      }

      // 2. 模擬原生點擊通道，極速啟動 iOS 捷徑
      const link = document.createElement('a');
      link.href = shortcutUrl;
      link.rel = 'noopener';
      document.body.appendChild(link);
      link.click();

      // 3. 0.6 秒自動關閉或返回
      setTimeout(function() {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.close();
        }
      }, 600);
    };
  </script>
</head>
<body style="background:#080c14;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;">
  <div style="font-size:32px;margin-bottom:12px;">🏁</div>
  <p style="font-size:15px;font-weight:bold;color:#60a5fa;margin:0;">正在啟動 iOS「通知抵達」捷徑…</p>
  <p style="font-size:12px;color:#94a3b8;margin-top:6px;">已同步記錄試算表第 14 欄</p>
</body>
</html>
